<main>
<section class="page-title"><h1>Make an Enquiry</h1><p>Ask about volunteering, sponsorship, partnerships or organising a blood drive.</p></section>
<section><form action="#" method="post">
<!-- Required NPO enquiry options -->
<label for="name">Name</label><input id="name" name="name" type="text" required>
<label for="surname">Surname</label><input id="surname" name="surname" type="text" required>
<label for="email">Email Address</label><input id="email" name="email" type="email" required>
<label for="phone">Contact Number</label><input id="phone" name="phone" type="tel">
<label for="type">Enquiry Type</label>
<select id="type" name="type" required>
<option value="">Please select</option><option>General Enquiry</option><option>Volunteer</option><option>Sponsorship</option><option>Organise a Blood Drive</option><option>Partnership</option>
</select>
<label for="message">Message</label><textarea id="message" name="message" required></textarea>
<button class="button" type="submit">Submit Enquiry</button>
</form></section>
</main>
